name: CI

# Every branch and every pull request. A trigger covering only the last hop
# into main is not a gate: with `branches: [main, develop]` a PR based on any
# other branch ran NO JOB AT ALL, so every step below was skipped rather than
# failed -- the cheapest way to disable a whole pipeline without touching a
# single step, which is why gate-self-test asserts it.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # This repo's lockfile is pnpm-lock.yaml and CLAUDE.md says `pnpm install`,
      # but CI ran `npm ci`, which requires a package-lock.json that has never
      # existed here. Every run on `main` failed at install with EUSAGE, so no
      # stub guard, no lint, no test and no build has ever executed in CI for
      # this package. Found while shipping SOC-174; the PR could not go green
      # for a reason that had nothing to do with the PR.
      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs before the gates it vouches for: it seeds a violation of each one
      # and requires a non-zero exit. Every blocker in the 2026-08-11 audit was
      # a control that existed and had never executed, so "the step is present"
      # stopped counting as evidence. See scripts/gate-self-test.mjs.
      - name: Gate self-test
        run: pnpm run gate-self-test

      # Zero dependencies, so it would run before install too. It is here so a
      # broken lockfile fails first and the changelog result is never read out
      # of an environment that could not install.
      - name: Changelog gate
        run: node scripts/ci-changelog.mjs

      - name: Stub guard
        run: |
          PATTERNS=(
            "// *(TODO|FIXME|HACK|XXX|PLACEHOLDER|placeholder)"
            "did:(web|example):demo"
            "did:(web|example):medico|did:example:"
            "['\"]fake[_-]|['\"]dummy[_-]|['\"]sample[_-]"
            "alert\(['\"]"
            "coming.?soon|próximamente|proximamente"
            "not yet implemented|not implemented"
            "'00000'|\"00000\""
          )
          EXCLUDE="node_modules/\|/dist/\|__tests__/\|__mocks__/\|/demo/\|/scripts/\|/fixtures/\|\.test\.\|\.spec\.\|vitest\.\|jest\."
          INCLUDE='\.ts:\|\.tsx:\|\.vue:\|\.js:\|\.mjs:'
          # `^ *\*` could never match: these are grep -n lines, so the content
          # starts after `path:lineno:`, never at column 0. Same inert rule
          # found and fixed in attestto-did-resolver.
          ALLOW='stub-guard-ignore\|/i18n/\|/locales/\|@example\|/\*\*\|^[^:]*:[0-9][0-9]*: *\*'
          HITS=0
          for pat in "${PATTERNS[@]}"; do
            matches=$(grep -rEn -i "$pat" src 2>/dev/null | grep "$INCLUDE" | grep -v "$EXCLUDE" | grep -v "$ALLOW" || true)
            if [ -n "$matches" ]; then
              echo "$matches"
              HITS=$((HITS + $(echo "$matches" | wc -l)))
            fi
          done
          if [ "$HITS" -gt 0 ]; then
            echo "::error::Stub guard failed: $HITS stub(s) found"
            exit 1
          fi
          echo "Stub guard passed"

      - name: Lint
        run: pnpm lint

      # Type-checks the tests, which tsconfig.json excludes. Without this pass
      # a type error inside a spec is invisible.
      - name: Type-check (src + tests)
        run: pnpm exec tsc --noEmit -p tsconfig.test.json

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
